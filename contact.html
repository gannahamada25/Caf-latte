<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Contact Us | Café Latte</title>
</head>
<body>
    <div class="container">    
        <nav>
            <header>
                <p class="logo"> Café Latte </p>
            </header>
            <div class="ul">
            <ul>
                <li>
                    <a href="index.html"> <i class="fas fa-house"></i> Home </a>
                </li>
                <li>
                    <a href="menu.html"><i class="fas fa-list"></i> Menu </a>
                </li>
                <li>
                    <a href="best.html"> <i class="fas fa-heart"></i> Best Seller </a>
                </li>
                <li>
                    <a href="contact.html" class="active"> <i class="fas fa-phone"></i> Contact Us </a>
                </li>
                <li>
                    <a href="about.html"> <i class="fas fa-circle-info"></i> About</a>
                </li>
            </ul>
            </div>
        </nav>
        <div class="contact-text">
            <h1>CONTACT US</h1>
            <p>We’d love to hear from you! Send us a message and we’ll get back to you as soon as possible</p>
        </div>
        <form>
            <div class="inp">
               <i class="fas fa-user"> </i>
               <input type="text" placeholder="Your Name......"> 
            </div>
            <br>
            <div class="inp">
                <i class="fas fa-envelope"> </i>
                <input type="email" placeholder="Your Email......">
            </div>
            <br>
            <div class="inp">
                <i class="fas fa-phone"> </i>
                <input type="number" placeholder="Your Number....." >
            </div>
            <br>
            <div class="inp">
                <i class="fas fa-edit"></i>  
                <textarea name="message" placeholder="Your Message....."></textarea>
            </div>
            <br>
            <input type="submit" class="submit" value="Send Message">  
        </form>
    </div>
    <footer>
        <p>&copy; 2026 Café Latte . All rights reserved.</p>
        <p>Designed by Ganna Hamada</p>
    </footer>    
</body>
</html>
